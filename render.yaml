# FIT System - Blueprint de Render.
# Deploy: dashboard.render.com -> New -> Blueprint -> elegí este repo.
# Al crear, Render pedirá las variables marcadas con sync:false.
#
# Este blueprint despliega:
#   1) fitsystem-licensador -> servicio de licencias del proveedor (Node, sin deps).
#   2) fitsystem-web        -> web pública (landing + panel) con Next.js.
#   3) fitsystem-socios     -> app del socio (PWA).
#   4) fitsystem-api        -> API del gimnasio en la nube (PostgreSQL).
services:
  # ---------------------------------------------------------------------------
  # Licensador (sistema de licencias del proveedor)
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-licensador
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: apps/licensador
    buildCommand: ""
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # Render está detrás de un proxy: permite confiar en X-Forwarded-For para el
      # bloqueo por intentos fallidos (IP real del cliente).
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      # Respaldo remoto del estado (durabilidad con disco efímero). BACKUP_URL es
      # la base de la API + /api; BACKUP_TOKEN debe coincidir con el
      # PROVIDER_BACKUP_TOKEN de la API. Si se omite, no hay respaldo remoto.
      - key: BACKUP_URL
        value: https://fitsystem-api.onrender.com/api
      - key: BACKUP_TOKEN
        sync: false
      # Firmas: definí LICENSE_PRIVATE_KEY (Ed25519, preferido) para emitir y
      # verificar. LICENSE_SECRET (HMAC) se acepta solo si NO hay clave Ed25519.
      - key: LICENSE_SECRET
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
    # AVISO: en el plan free el disco es EFÍMERO. Las claves firmadas válidas se
    # re-importan al activarse (así funciona tras un reinicio), pero se pierden las
    # revocaciones y los asientos. Para conservar emisiones, asientos y revocaciones
    # usá un disco persistente (plan pago):
    # disk:
    #   name: licensador-data
    #   mountPath: /opt/render/project/src/apps/licensador/data
    #   sizeGB: 1

  # ---------------------------------------------------------------------------
  # Web pública (landing + panel) - Next.js sobre monorepo pnpm
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-web
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fitsystem/web build"
    startCommand: "pnpm --filter @fitsystem/web exec next start -p $PORT"
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # URL pública de la API del gimnasio. Se incrusta en el build (NEXT_PUBLIC_*).
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # URL pública de la app de socios (PWA), para el enlace "Probar la app del
      # socio" de la portada. Ej: https://fitsystem-socios.onrender.com
      - key: NEXT_PUBLIC_SOCIOS_URL
        sync: false

  # ---------------------------------------------------------------------------
  # App del socio (PWA instalable) - export web de Expo.
  # El socio abre la URL y la "instala" desde el navegador (Agregar a pantalla de
  # inicio). Apuntá EXPO_PUBLIC_API_URL a la API que consuma la app.
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-socios
    runtime: static
    autoDeploy: true
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fitsystem/mobile build:web"
    staticPublishPath: apps/mobile/dist
    # Cabeceras de seguridad del sitio estático (CDN de Render). Sin CSP para no
    # romper el PWA (scripts inline); el resto endurece la respuesta.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=15552000; includeSubDomains"
      - path: /*
        name: X-DNS-Prefetch-Control
        value: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: EXPO_PUBLIC_API_URL
        sync: false

  # ---------------------------------------------------------------------------
  # API del gimnasio en la nube + PostgreSQL.
  # El build genera el esquema PostgreSQL (schema.postgres.prisma) y compila;
  # el start aplica el esquema (db push) y levanta la API.
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-api
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fitsystem/api prisma:generate:pg && pnpm --filter @fitsystem/api build"
    startCommand: "pnpm --filter @fitsystem/api db:push:pg && if [ \"$SEED_DEMO\" = \"1\" ]; then pnpm --filter @fitsystem/api prisma:seed; fi && pnpm --filter @fitsystem/api start"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # La API por defecto escucha solo loopback (escritorio); en Render debe ser pública.
      - key: API_HOST
        value: 0.0.0.0
      # Render termina TLS/proxy en un salto; request.ip toma la IP real del cliente.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: fitsystem-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Carga datos de demostración al arrancar (organización "fit-demo" con socios
      # y cuentas del portal). Idempotente. Poné "0" para desactivarlo en un
      # despliegue real con datos propios.
      # Demo socios: gimnasio "fit-demo", email "juan@mail.com" / "socio123".
      - key: SEED_DEMO
        value: "1"
      # --- Notificaciones push de la app del socio (Web Push / VAPID) ---
      # Generá el par de claves con: npx web-push generate-vapid-keys
      # La pública se entrega a la PWA para suscribirse; la privada firma los envíos.
      - key: VAPID_PUBLIC_KEY
        value: BHjzLxuWqNeVAw0yS2K07Ou9zz99DRFrW6Rg65ozTg0Px7rScvvQyB1dlpSIIUDIxr6KM1zFJGlJLC7G0FrA03k
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contacto.fitsystem@gmail.com
      # URL pública de la API (para webhooks de MercadoPago). Ej: https://fitsystem-api.onrender.com
      - key: PUBLIC_URL
        sync: false
      # URL pública de la app de socios (PWA): retorno de MercadoPago tras pagar.
      # Ej: https://fitsystem-socios.onrender.com
      - key: SOCIOS_URL
        sync: false
      # Orígenes permitidos (CORS), separados por coma. Ej:
      # https://fitsystem-web.onrender.com,https://fitsystem-socios.onrender.com
      - key: WEB_ORIGIN
        sync: false
      - key: LICENSE_SECRET
        sync: false
      - key: LICENSE_TRIAL_DAYS
        value: "7"
      - key: LICENSE_SERVER
        sync: false
      # Clave pública Ed25519 del proveedor para verificar claves/certificados del
      # Licensador. Si se omite, la API usa la clave embebida por defecto.
      - key: LICENSE_PUBLIC_KEY
        sync: false
      # Token compartido con el Licensador para respaldar/restaurar su estado en
      # Postgres (ver apps/api/src/routes/provider.ts). Debe coincidir con el
      # BACKUP_TOKEN del Licensador.
      - key: PROVIDER_BACKUP_TOKEN
        sync: false
      # --- Tienda del sitio (landing): contacto y pasarela de pago del proveedor ---
      # Destinatario del formulario de contacto de la landing.
      - key: PLATFORM_CONTACT_TO
        value: contacto.fitsystem@gmail.com
      # SMTP propio del sitio para el contacto y el alta de compra (si falta el
      # host, esos emails no salen, aunque la compra se registra igual).
      - key: PLATFORM_SMTP_HOST
        sync: false
      - key: PLATFORM_SMTP_PORT
        value: "587"
      - key: PLATFORM_SMTP_SECURE
        sync: false
      - key: PLATFORM_SMTP_USER
        sync: false
      - key: PLATFORM_SMTP_PASS
        sync: false
      - key: PLATFORM_SMTP_FROM
        sync: false
      # API key de Brevo (envío por HTTP). Recomendado en Render free, que
      # bloquea los puertos SMTP. Si está definido, tiene prioridad sobre SMTP.
      - key: PLATFORM_BREVO_API_KEY
        sync: false
      # Access token de MercadoPago de la cuenta del PROVEEDOR (pago embebido).
      - key: PLATFORM_MP_ACCESS_TOKEN
        sync: false
      # Public Key de la cuenta del proveedor (checkout embebido en la web).
      - key: PLATFORM_MP_PUBLIC_KEY
        sync: false
      # Secreto del webhook de MercadoPago del proveedor (opcional, recomendado).
      - key: PLATFORM_MP_WEBHOOK_SECRET
        sync: false
      # Credenciales de admin del Licensador para emitir la clave al aprobarse el pago.
      - key: LICENSOR_ADMIN_USER
        value: admin
      - key: LICENSOR_ADMIN_PASS
        sync: false

databases:
  - name: fitsystem-db
    plan: free
    databaseName: fitsystem
    postgresMajorVersion: "16"
