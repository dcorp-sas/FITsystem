# FIT System - Blueprint de Render.
# Deploy: dashboard.render.com -> New -> Blueprint -> elegí este repo.
# Al crear, Render pedirá las variables marcadas con sync:false.
#
# Este blueprint despliega:
#   1) fitsystem-licensador -> servicio de licencias del proveedor (Node, sin deps).
#   2) fitsystem-web        -> web pública (landing + panel) con Next.js.
#   3) fitsystem-socios     -> app del socio (PWA).
#   4) fitsystem-api        -> API del gimnasio en la nube (PostgreSQL).
services:
  # ---------------------------------------------------------------------------
  # Licensador (sistema de licencias del proveedor)
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-licensador
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: apps/licensador
    buildCommand: ""
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # Render está detrás de un proxy: permite confiar en X-Forwarded-For para el
      # bloqueo por intentos fallidos (IP real del cliente).
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      # Firmas: definí LICENSE_PRIVATE_KEY (Ed25519, preferido) para emitir y
      # verificar. LICENSE_SECRET (HMAC) se acepta solo si NO hay clave Ed25519.
      - key: LICENSE_SECRET
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
    # AVISO: en el plan free el disco es EFÍMERO. Las claves firmadas válidas se
    # re-importan al activarse (así funciona tras un reinicio), pero se pierden las
    # revocaciones y los asientos. Para conservar emisiones, asientos y revocaciones
    # usá un disco persistente (plan pago):
    # disk:
    #   name: licensador-data
    #   mountPath: /opt/render/project/src/apps/licensador/data
    #   sizeGB: 1

  # ---------------------------------------------------------------------------
  # Web pública (landing + panel) - Next.js sobre monorepo pnpm
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-web
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fitsystem/web build"
    startCommand: "pnpm --filter @fitsystem/web exec next start -p $PORT"
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # URL pública de la API del gimnasio. Se incrusta en el build (NEXT_PUBLIC_*).
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # ---------------------------------------------------------------------------
  # App del socio (PWA instalable) - export web de Expo.
  # El socio abre la URL y la "instala" desde el navegador (Agregar a pantalla de
  # inicio). Apuntá EXPO_PUBLIC_API_URL a la API que consuma la app.
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-socios
    runtime: static
    autoDeploy: true
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fitsystem/mobile build:web"
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: EXPO_PUBLIC_API_URL
        sync: false

  # ---------------------------------------------------------------------------
  # API del gimnasio en la nube + PostgreSQL.
  # El build genera el esquema PostgreSQL (schema.postgres.prisma) y compila;
  # el start aplica el esquema (db push) y levanta la API.
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsystem-api
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fitsystem/api prisma:generate:pg && pnpm --filter @fitsystem/api build"
    startCommand: "pnpm --filter @fitsystem/api db:push:pg && pnpm --filter @fitsystem/api start"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # La API por defecto escucha solo loopback (escritorio); en Render debe ser pública.
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: fitsystem-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # URL pública de la API (para webhooks de MercadoPago). Ej: https://fitsystem-api.onrender.com
      - key: PUBLIC_URL
        sync: false
      # Orígenes permitidos (CORS), separados por coma. Ej:
      # https://fitsystem-web.onrender.com,https://fitsystem-socios.onrender.com
      - key: WEB_ORIGIN
        sync: false
      - key: LICENSE_SECRET
        sync: false
      - key: LICENSE_TRIAL_DAYS
        value: "7"
      - key: LICENSE_SERVER
        sync: false
      # Clave pública Ed25519 del proveedor para verificar claves/certificados del
      # Licensador. Si se omite, la API usa la clave embebida por defecto.
      - key: LICENSE_PUBLIC_KEY
        sync: false

databases:
  - name: fitsystem-db
    plan: free
    databaseName: fitsystem
    postgresMajorVersion: "16"
