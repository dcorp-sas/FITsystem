name: uptime

# Monitoreo de disponibilidad: chequea web, socios, api y licensador cada 15 min
# contra el VPS de produccion (fitsystem.com.ar). Si algo falla, el workflow falla
# (GitHub notifica al dueno del repo) y se abre/actualiza un issue con la etiqueta
# "uptime".

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chequear servicios
        run: node scripts/uptime-check.mjs

      - name: Abrir o actualizar issue si falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Uptime: servicio caido';
            const body = [
              'El chequeo automatico de disponibilidad fallo.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Revisar el log del paso "Chequear servicios" para ver que servicio no respondio.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime'],
              });
            }
