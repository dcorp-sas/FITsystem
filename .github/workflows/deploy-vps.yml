name: deploy

# Despliegue automatico al VPS de produccion (fitsystem.com.ar).
# En cada push a main entra por SSH, actualiza el clon del repo en /opt/fitsystem
# y reconstruye los contenedores con docker compose. El .env del VPS no esta en
# el repo (esta en .gitignore), asi que se conserva entre despliegues.
#
# Requiere los secretos del repositorio (Settings > Secrets and variables > Actions):
#   VPS_HOST    -> IP o host del VPS (ej. 190.183.229.160)
#   VPS_USER    -> usuario SSH (por defecto root)
#   VPS_SSH_KEY -> clave privada SSH (contenido completo del archivo id_ed25519)
#   VPS_PORT    -> puerto SSH (opcional, por defecto 22)
# Si faltan VPS_HOST o VPS_SSH_KEY, el workflow se omite sin fallar.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar si estan los secretos
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secretos VPS_HOST/VPS_SSH_KEY; se omite el deploy."
          fi

      - name: Preparar la clave SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Actualizar el codigo y reconstruir en el VPS
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSHUSER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${PORT:-22}"
          SSHUSER="${SSHUSER:-root}"
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=40 -o TCPKeepAlive=yes -o ConnectTimeout=30 -i $HOME/.ssh/id_ed25519 -p $PORT"
          remote() { ssh $SSH_OPTS "$SSHUSER@$HOST" "$1"; }

          # Prepara el repo y lanza el build EN SEGUNDO PLANO. El VPS tiene 2 GB
          # de RAM y el build puede tardar varios minutos; si se corre en primer
          # plano la sesion SSH se cae por inactividad ("Broken pipe").
          remote '
            set -e
            cd /opt/fitsystem
            git fetch --prune origin main
            git reset --hard origin/main
            # La cache de build de Docker crece en cada despliegue y puede llenar
            # el disco del VPS (30 GB): podarla antes de construir. Si el disco
            # igual esta ajustado, se hace una poda total.
            docker builder prune -af --filter "until=24h" >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            used=$(df --output=pcent / | tail -1 | tr -dc "0-9")
            if [ "${used:-0}" -ge 75 ]; then docker builder prune -af >/dev/null 2>&1 || true; fi
            rm -f /tmp/fitsystem-deploy.done /tmp/fitsystem-deploy.pid
            : > /tmp/fitsystem-deploy.log
            nohup bash -c "COMPOSE_PARALLEL_LIMIT=1 docker compose -f docker-compose.prod.yml up -d --build; echo \$? > /tmp/fitsystem-deploy.done" >>/tmp/fitsystem-deploy.log 2>&1 &
            echo $! > /tmp/fitsystem-deploy.pid
            echo "build lanzado (pid $(cat /tmp/fitsystem-deploy.pid))"
          '

          # Espera activa (hasta ~30 min) manteniendo viva la conexion.
          for i in $(seq 1 120); do
            if remote 'test -f /tmp/fitsystem-deploy.done'; then break; fi
            echo "build en curso ($((i*15))s)..."
            sleep 15
          done

          remote 'tail -n 100 /tmp/fitsystem-deploy.log'
          code=$(remote 'cat /tmp/fitsystem-deploy.done 2>/dev/null || echo missing')
          if [ "$code" != "0" ]; then
            echo "::error::El build fallo en el VPS (exit $code)"
            exit 1
          fi
          remote 'docker image prune -f >/dev/null 2>&1 || true; docker compose -f docker-compose.prod.yml ps'
