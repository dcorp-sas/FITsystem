name: ci

# Integración continua: instala, verifica tipos y corre los tests unitarios en
# cada push y pull request hacia main. Es la red de seguridad que faltaba para
# no volver a romper lo que ya funciona.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Cachear el store de pnpm
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm --filter @fitsystem/api prisma:generate

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Compilar la API
        run: pnpm --filter @fitsystem/api build
